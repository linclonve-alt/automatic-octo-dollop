name: Build installer
on:
  workflow_dispatch:      # adds a "Run workflow" button on GitHub
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build app
        run: |
          pip install fastapi uvicorn requests pyinstaller pywebview tzdata
          EXTRA=""
          if [ -f server.py ]; then
            EXTRA="--hidden-import server"
            if pip install paradex_py; then EXTRA="$EXTRA --collect-all paradex_py"; else echo "Paradex support skipped (OANDA only)"; fi
          else
            echo "No server.py found: building OANDA-only"
          fi
          pyinstaller --noconfirm --onedir --noconsole --name DayTradeRiskManager \
            --add-data "static;static" \
            --hidden-import server_oanda --hidden-import daylock --hidden-import webview \
            --collect-submodules uvicorn --collect-data tzdata \
            $EXTRA trader_app.py
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: DayTradeRiskManager-Setup
          path: installer_out/DayTradeRiskManager-Setup.exe
